name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Java ${{ matrix.java }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        java: ['17', '21', '25']
        include:
          - os: windows-latest
            java: '21'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      # Compiles with -Xlint:all -Werror, runs the tests, enforces 90 % line coverage and
      # builds the javadoc (doclint, warnings fail) and sources jars.
      - name: Verify
        run: mvn -B -ntp verify
      - name: Compile examples
        shell: bash
        run: javac -Xlint:all -Werror -cp target/classes -d target/examples examples/*.java

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # The library has no runtime dependencies; the tree must hold only the project itself.
      - name: No runtime dependencies
        run: |
          mvn -B -ntp dependency:tree -Dscope=runtime -DoutputFile=runtime-deps.txt
          cat runtime-deps.txt
          test "$(grep -c . runtime-deps.txt)" -eq 1
